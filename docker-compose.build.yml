# Optional overlay: build the image locally instead of pulling it.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The base image (official distroless xray-core) is pinned below; bump it to
# upgrade the bundled core.
services:
  xray:
    image: xray-core:local
    build:
      context: .
      args:
        XRAY_IMAGE: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:26.10.21}
