# Optional overlay: build the image locally instead of pulling it.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The base image (official distroless xray-core) defaults to `latest`, so a
# local build picks up the newest core; set XRAY_IMAGE to pin a version.
services:
  xray:
    image: xray-core:local
    build:
      context: .
      args:
        XRAY_IMAGE: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:latest}
