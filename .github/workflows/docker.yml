name: build

# Builds this node image, smoke-tests the config generator, then publishes to
#   ghcr.io/<owner>/<repo>                     (built-in GITHUB_TOKEN, no secret)
#   docker.io/<DOCKERHUB_USERNAME>/xray-core   (needs 2 repo secrets)
#
# The baked-in Xray core follows the newest upstream release, and the image
# tags follow that core version:
#
#   latest  +  v<core version>        e.g.  latest + v26.10.29
#
# Nothing is pinned in this file: every run asks the GitHub API for the newest
# XTLS/Xray-core release. A new upstream release is picked up by the next push,
# by "Run workflow", or by the daily schedule below.
#
# Rollback / test build: workflow_dispatch with xray_version=26.10.21 pushes
# only v26.10.21 and leaves `latest` untouched.
#
# Required secrets for Docker Hub (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME   your docker hub account name
#   DOCKERHUB_TOKEN      an access token with Read & Write scope
# ghcr.io needs no secret at all, GITHUB_TOKEN is enough (packages: write below).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Xray-core version to bake in (e.g. 26.10.29). Empty = newest release."
        required: false
        default: ""
  schedule:
    # daily: rebuild when upstream ships a new Xray-core release
    - cron: "23 3 * * *"

permissions:
  contents: read

env:
  # image name used on docker hub (and as the local tag during smoke test)
  IMAGE_NAME: xray-core

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0. decide which Xray-core release to build and which tags to publish
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve Xray-core version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      publish_latest: ${{ steps.v.outputs.publish_latest }}
      needs_build: ${{ steps.v.outputs.needs_build }}
    steps:
      - name: resolve newest Xray-core release
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ github.event.inputs.xray_version }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version="${REQUESTED:-}"
          version="${version#v}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest \
              | jq -r '.tag_name // empty')
            version="${version#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not resolve a valid Xray-core version (got '${version}')"
            exit 1
          fi

          if [ -n "${REQUESTED:-}" ]; then
            # an explicit pin is a rollback/test build: never move `latest`
            publish_latest=false
          else
            publish_latest=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/xtls/xray-core:${version}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"

          # only the daily schedule skips when this core version is already out
          needs_build=true
          if [ "$EVENT" = "schedule" ] && [ -n "${DOCKERHUB_USER:-}" ]; then
            url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/${IMAGE_NAME}/tags/v${version}"
            if curl -fsS -o /dev/null "$url" 2>/dev/null; then
              needs_build=false
              echo "v${version} is already published, skipping this scheduled run"
            fi
          fi
          echo "needs_build=${needs_build}" >> "$GITHUB_OUTPUT"

          echo "resolved Xray-core ${version} (publish_latest=${publish_latest})"

  # ---------------------------------------------------------------------------
  # 1. build the image for amd64 and prove that keygen + configs are valid
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke test (keygen + xray -test)
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: docker compose config (validates compose + .env interpolation)
        run: docker compose config -q

      - name: shell syntax check (install.sh + manage.sh + entrypoint.sh)
        run: |
          bash -n install.sh
          bash -n manage.sh
          sh -n docker/entrypoint.sh

      - name: build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: local/xray-node:smoke
          build-args: |
            XRAY_IMAGE=${{ needs.resolve.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: generate a fresh key set
        run: |
          mkdir -p smoke-data
          docker run --rm \
            -e LISTEN_PORT=443 \
            -e PUBLIC_PORT=443 \
            -e SERVER_ADDR=127.0.0.1 \
            -e NODE_NAME=ci-smoke \
            -v "$PWD/smoke-data:/data" \
            local/xray-node:smoke keygen

      - name: assert generated artifacts
        run: |
          set -eux
          test -s smoke-data/server.json
          test -s smoke-data/keys.env
          test -s smoke-data/vless-link.txt
          test -s smoke-data/client.json
          test -s smoke-data/connection-info.txt
          test "$(stat -c %a smoke-data/keys.env)" = "600"
          # post-quantum VLESS encryption (ML-KEM-768)
          grep -q 'mlkem768x25519plus.native.600s' smoke-data/server.json
          sudo grep -q 'mlkem768x25519plus.native.0rtt' smoke-data/client.json
          # REALITY + XHTTP + Vision + camouflage host
          grep -q '"security": "reality"' smoke-data/server.json
          grep -q '"network": "xhttp"' smoke-data/server.json
          grep -q 'xtls-rprx-vision' smoke-data/server.json
          grep -q 'www.lovelive-anime.jp' smoke-data/server.json
          # client config points at the node and ships local inbounds
          sudo grep -q '"protocol": "vless"' smoke-data/client.json
          sudo grep -q '"port": 10808' smoke-data/client.json
          sudo grep -q '"port": 10809' smoke-data/client.json
          # share link carries the right query params for v2rayN
          grep -q 'type=xhttp' smoke-data/vless-link.txt
          grep -q 'security=reality' smoke-data/vless-link.txt
          grep -q 'encryption=mlkem768x25519plus' smoke-data/vless-link.txt
          grep -q 'flow=xtls-rprx-vision' smoke-data/vless-link.txt

      - name: re-validate configs with the shipped binary
        run: |
          docker run --rm --entrypoint /usr/local/bin/xray \
            -v "$PWD/smoke-data:/data" local/xray-node:smoke \
            run -test -c /data/server.json
          docker run --rm --entrypoint /usr/local/bin/xray \
            -v "$PWD/smoke-data:/data" local/xray-node:smoke \
            run -test -c /data/client.json

      - name: summary
        run: |
          {
            echo "### smoke test passed"
            echo ""
            echo "Xray-core: ${XRAY_VERSION}"
            echo ""
            echo "generated link (truncated):"
            echo ""
            echo '```'
            cut -c1-160 smoke-data/vless-link.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          XRAY_VERSION: ${{ needs.resolve.outputs.version }}

  # ---------------------------------------------------------------------------
  # 2. multi-arch build & push (amd64 + arm64)
  # ---------------------------------------------------------------------------
  publish:
    name: publish (ghcr.io + docker hub)
    needs: [resolve, smoke]
    if: github.event_name != 'pull_request' && needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      XRAY_IMAGE: ${{ needs.resolve.outputs.image }}
      XRAY_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: compute image names
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          else
            echo "DOCKERHUB_IMAGE=" >> "$GITHUB_ENV"
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set, skipping docker hub"
          fi
          echo "building Xray-core ${XRAY_VERSION} (${XRAY_IMAGE})"

      # ---------------------------- ghcr.io -----------------------------------
      - name: login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: meta (ghcr)
        id: meta_ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=v${{ needs.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.publish_latest }}
          labels: |
            org.opencontainers.image.title=Xray XHTTP + REALITY + VLESS Encryption node
            org.opencontainers.image.description=One-click Xray node: XHTTP + VLESS Encryption (ML-KEM-768) + XTLS Vision + REALITY, keys auto generated
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=v${{ needs.resolve.outputs.version }}
            org.opencontainers.image.base.name=ghcr.io/xtls/xray-core:${{ needs.resolve.outputs.version }}

      - name: build & push to ghcr.io
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          build-args: |
            XRAY_IMAGE=${{ needs.resolve.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------- docker hub --------------------------------
      - name: login to docker hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: meta (docker hub)
        if: env.DOCKERHUB_IMAGE != ''
        id: meta_dockerhub
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=v${{ needs.resolve.outputs.version }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.publish_latest }}
          labels: |
            org.opencontainers.image.title=Xray XHTTP + REALITY + VLESS Encryption node
            org.opencontainers.image.description=One-click Xray node: XHTTP + VLESS Encryption (ML-KEM-768) + XTLS Vision + REALITY, keys auto generated
            org.opencontainers.image.version=v${{ needs.resolve.outputs.version }}
            org.opencontainers.image.base.name=ghcr.io/xtls/xray-core:${{ needs.resolve.outputs.version }}

      - name: build & push to docker hub
        if: env.DOCKERHUB_IMAGE != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          build-args: |
            XRAY_IMAGE=${{ needs.resolve.outputs.image }}
          # the ghcr build above already filled the cache, so this is cheap
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # keeps the docker hub "Overview" tab in sync with README.md
      - name: sync docker hub overview
        if: env.DOCKERHUB_IMAGE != ''
        run: |
          jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
            '{username:$u,password:$p}' > /tmp/dh_login.json
          JWT=$(curl -sf -X POST -H 'Content-Type: application/json' \
                  --data-binary @/tmp/dh_login.json \
                  https://hub.docker.com/v2/users/login | jq -r '.token // empty')
          if [ -z "$JWT" ]; then
            echo "::warning::docker hub login failed, overview not updated"
            exit 0
          fi
          jq -n --arg desc "Xray in Docker: XHTTP + VLESS-Encryption (ML-KEM-768) + Vision + REALITY, auto keys" \
                --rawfile readme README.md \
            '{description:$desc, full_description:$readme}' > /tmp/dh_patch.json
          curl -sf -o /dev/null -w 'overview updated, http=%{http_code}\n' \
            -X PATCH -H "Authorization: JWT ${JWT}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/dh_patch.json \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/" \
            || echo "::warning::could not update docker hub overview (token needs Read & Write scope)"

      - name: summary (publish)
        run: |
          {
            echo "### published Xray-core ${XRAY_VERSION}"
            echo ""
            echo "ghcr.io:"
            echo '```'
            echo "${{ steps.meta_ghcr.outputs.tags }}"
            echo '```'
            if [ -n "${DOCKERHUB_IMAGE}" ]; then
              echo "docker hub:"
              echo '```'
              echo "${{ steps.meta_dockerhub.outputs.tags }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
